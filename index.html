<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú rotativo para dos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5ef;--fg:#1c2b24;--mut:#5d6b64;--card:#fff;--line:#dbe3d8;--him:#2d5f8f;--himbg:#e6eef6;--her:#3f7d34;--herbg:#e7f2e3;--sh:#c98a14;--shbg:#fbf1da;--chip:#e3eadf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--fg:#e8efe9;--mut:#9aaaa0;--card:#1b2620;--line:#2c3a32;--him:#7fb0e0;--himbg:#1b2a38;--her:#8fcf7f;--herbg:#1d2e1a;--sh:#e8b84a;--shbg:#33290f;--chip:#243029}}
:root[data-theme="dark"]{--bg:#121a16;--fg:#e8efe9;--mut:#9aaaa0;--card:#1b2620;--line:#2c3a32;--him:#7fb0e0;--himbg:#1b2a38;--her:#8fcf7f;--herbg:#1d2e1a;--sh:#e8b84a;--shbg:#33290f;--chip:#243029}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 "DM Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:800 clamp(28px,7vw,40px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 18px}
.legend{display:flex;gap:14px;margin:0 0 16px;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
nav.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:14px;margin-bottom:16px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--fg);font:700 15px "DM Sans",sans-serif;padding:10px 6px;border-radius:10px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible{outline:3px solid var(--sh);outline-offset:2px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.days button{flex:0 0 auto;min-width:58px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:8px 10px;font:700 15px "DM Sans",sans-serif;cursor:pointer;text-align:center}
.days button small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.days button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.days button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
h2{font:800 22px/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 12px}
.meal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.meal h3{margin:0 0 8px;font:700 15px "DM Sans",sans-serif;color:var(--mut)}
.shared{background:var(--shbg);border-radius:10px;padding:10px 12px;border-left:5px solid var(--sh)}
.split{display:grid;gap:8px}
.him,.her{border-radius:10px;padding:10px 12px}
.him{background:var(--himbg);border-left:5px solid var(--him)}
.her{background:var(--herbg);border-left:5px solid var(--her)}
.who{display:block;font-weight:700;font-size:13px;margin-bottom:2px}
.him .who{color:var(--him)}.her .who{color:var(--her)}
@media(min-width:560px){.split{grid-template-columns:1fr 1fr}}
.sec{margin:0 0 18px}
.sec h3{font:800 17px "Bricolage Grotesque",sans-serif;margin:0 0 6px}
label.it{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
label.it input{width:20px;height:20px;margin-top:1px;accent-color:var(--her);flex:0 0 auto}
label.it input:checked+span{text-decoration:line-through;color:var(--mut)}
.note{color:var(--mut);font-size:14px;margin:0 0 14px}
.reset{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:8px 12px;font:700 14px "DM Sans",sans-serif;cursor:pointer}
details.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 14px}
details.rc summary{cursor:pointer;font-weight:700;padding:13px 0;list-style:none}
details.rc summary::-webkit-details-marker{display:none}
details.rc summary::after{content:"+";float:right;color:var(--mut);font-size:20px;line-height:1}
details.rc[open] summary::after{content:"–"}
details.rc .ing{color:var(--mut);font-size:14px;margin:0 0 8px}
details.rc ol{margin:0 0 14px;padding-left:20px}
details.rc li{margin-bottom:6px}
.gh{font:800 18px "Bricolage Grotesque",sans-serif;margin:18px 0 8px}
nav.tabs button{font-size:14px}
.wk{display:flex;gap:8px;margin:0 0 12px}.wk button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:9px;font:700 15px "DM Sans",sans-serif;cursor:pointer}.wk button[aria-pressed="true"]{background:var(--her);border-color:var(--her);color:#fff}.rb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rbtn{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:6px 12px;font:700 13px "DM Sans",sans-serif;cursor:pointer}.rbtn:focus-visible,.wk button:focus-visible{outline:3px solid var(--sh);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="legend"><span><i class="dot" style="background:var(--him)"></i>Él</span><span><i class="dot" style="background:var(--her)"></i>Ella</span><span><i class="dot" style="background:var(--sh)"></i>Los dos</span></div>

<button role="tab" aria-selected="false" data-t="prep">Meal prep</button>
<button role="tab" aria-selected="false" data-t="recetas">Recetas</button>
</nav>
<section id="menu"><div class="days" id="days"></div><div id="day"></div></section>

["tartaac","A","Tarta de acelga cremosa","1 masa de tarta integral, 1 atado de acelga cocida, 1 cebolla, 2 huevos, 100 g de queso crema o ricota, nuez moscada, queso rallado.","Salteá la cebolla y la acelga picada.|Mezclá con huevos, queso crema, nuez moscada y queso rallado.|Volcá sobre la masa y horneá 35 minutos a 190 °C."],
["calzon","A","Calzones de masa casera","Masa de pan casero. Él: jamón y muzzarella. Ella: espinaca salteada, ricota y huevo duro.","Estirá la masa en círculos de 20 cm.|Rellená una mitad y cerrá en media luna, sellando con un tenedor.|Pincelá con aceite y horneá 20 a 25 minutos a 220 °C."],
["panq","A","Panqueques salados","1 huevo, 1 taza de leche, ¾ taza de harina, ricota, espinaca, nuez moscada, salsa de tomate, queso. Él: jamón.","Batí huevo, leche, harina y sal; cociná panqueques finos en sartén antiadherente.|Rellenalos con ricota, espinaca salteada y nuez moscada.|Enrollá, cubrí con salsa y queso, y gratiná 10 minutos."],
["ensal","A","Ensaladas (apio, chauchas y remolacha, mediterránea)","Apio, rúcula, perejil, chauchas, remolacha, tomate, aceitunas, cebolla morada, morrón, queso.","Apio, rúcula y perejil: apio en rodajas finas con limón y aceite de oliva.|Chauchas y remolacha: hervidas y en cubos, con cebolla morada, vinagre y aceite.|Mediterránea: tomate, aceitunas, cebolla morada, morrón y queso en cubos, con orégano y aceite de oliva."],
["budin","A","Budín de yogur y limón (la yapa)","1 pote de yogur y, usando ese pote como medida: ½ de azúcar, ½ de aceite, 3 de harina (mitad integral); 3 huevos, 2 cdtas de polvo de hornear, ralladura de 1 limón.","Mezclá todo.|Horneá 40 minutos a 180 °C."],
["mijo","B","Medallones de mijo y calabaza","1 taza de mijo, 3 tazas de caldo, ½ calabaza, 1 cebolla, 3 a 4 cdas de harina o avena, 1 cda de pimentón, canela (opcional). Salsa: yogur, limón.","Lavá el mijo y cocinalo en el caldo 40 a 60 minutos; dejalo enfriar.|Salteá la calabaza y la cebolla en cubos chicos hasta dorar.|Mezclá todo, aplastando un poco, con harina o avena, pimentón, sal y pimienta; dejá reposar.|Formá los medallones y hornealos a 180 °C, 5 minutos por lado. Servilos con salsa de yogur y limón."],
["coliflor","B","Coliflor gratinada","1 coliflor, 1 cda de manteca, 1 cda de harina, 1 taza de leche, queso rallado.","Herví los ramitos 5 minutos y ponelos en una fuente.|Hacé una salsa blanca con manteca, harina y leche; cubrí la coliflor y sumá queso.|Gratiná 15 minutos."],
["canel","B","Canelones de carne y de ricota","Panqueques (receta de panqueques salados), salsa de tomate, queso. Él: 180 g de carne picada, cebolla y espinaca. Ella: 150 g de ricota, espinaca, nueces y nuez moscada.","Cociná los panqueques finos.|Preparé cada relleno: la carne salteada con cebolla y espinaca; la ricota mezclada con espinaca, nueces y nuez moscada.|Rellená, enrollá y acomodá en una fuente con salsa de tomate y queso.|Gratiná 15 minutos."],
["wok","B","Wok de vegetales con spaghetti","Cebolla, morrón, zanahoria, zucchini, chauchas, brócoli, 1 ajo, soja, 70 g de spaghetti. Él: 180 g de carne en tiras. Ella: 150 g de tofu.","Cortá las verduras. Dorá a fuego fuerte la carne, o el tofu marinado con soja, y reservalo.|Salteá las verduras 10 minutos, sumá un poco de agua y tapá 5 minutos; terminá destapado 10 minutos más.|Mezclá con el spaghetti cocido, la proteína y un chorro de soja."],
["carbonada","B","Carbonada","180 g de carne en cubos (él), 1 cebolla, 1 morrón, 2 ajos, pimentón, tomate triturado, 1 papa, 1 batata, zapallo, 2 choclos, caldo. Ella: 1 taza de alubias cocidas.","Dorá la carne en cubos y sofreí cebolla, ajo y morrón.|Sumá pimentón, tomate, papa, batata, zapallo y choclo desgranado.|Cubrí con caldo y cociná 40 minutos. Ella: sumá las alubias 10 minutos antes del final, sin carne."],
["hamb","B","Hamburguesas en pan casero","Él: 180 g de carne picada, ajo, perejil. Ella: 2 tazas de lentejas cocidas, ½ taza de avena, 1 huevo, cebolla, ajo, pimentón (o la versión de garbanzos). Pan casero, lechuga, tomate, cebolla morada, queso, batatas.","Formá las hamburguesas: la de carne con ajo y perejil; la de lentejas pisando todo junto y dejando reposar 10 minutos.|Cociná en plancha 4 minutos por lado, o la de lentejas en horno a 200 °C 20 minutos.|Armá en pan casero con los extras.|Acompañá con batatas en bastones al horno a 220 °C."],
["lasana","B","Lasaña de carne y de lentejas","Placas de lasaña, boloñesa de carne y de lentejas (ver Boloñesa), espinaca salteada, salsa blanca liviana, muzzarella.","Preparé las dos boloñesas, la espinaca y la salsa blanca.|En dos fuentes chicas alterná capas de pasta, boloñesa, espinaca, salsa blanca y muzzarella.|Terminá con queso y horneá 30 minutos a 190 °C."],
["zrell","B","Zapallitos redondos rellenos","4 zapallitos redondos, 1 taza de arroz integral cocido, 1 taza de lentejas, cebolla, queso, perejil.","Herví los zapallitos 10 minutos, cortá la tapa y vaciá con una cuchara.|Mezclá la pulpa con arroz, lentejas, cebolla salteada, queso y perejil.|Rellená y gratiná 15 minutos a 200 °C."],
["spag","B","Spaghetti con brócoli y ajo","70 g de spaghetti, brócoli, 3 ajos, aceite de oliva, ají molido. Él: atún y 2 huevos duros. Ella: 3 huevos y queso rallado.","Cociná el brócoli en la misma olla del spaghetti los últimos 4 minutos.|Dorá los ajos laminados en aceite de oliva con ají molido.|Mezclá todo y sumá el atún (él) o los huevos poché (ella)."],
["tortilla","B","Tortilla de papa, cebolla y morrón","250 g de papa, 1 cebolla, ½ morrón, 3 huevos.","Cociná la papa en láminas con la cebolla y el morrón hasta que estén tiernas.|Mezclá con los huevos batidos y cociná 4 minutos por lado."],
["gramajo","B","Revuelto gramajo al horno","250 g de papa, 3 huevos. Él: jamón. Ella: arvejas y queso.","Horneá la papa en bastones a 220 °C, 30 minutos.|Revolvé los huevos en una sartén y mezclalos con la papa.|Sumá jamón (él) o arvejas y queso (ella)."],
["frittata","B","Frittata de espinaca y calabaza","Cebolla, calabaza en cubos chicos, espinaca, 3 huevos, queso.","Salteá cebolla, calabaza y espinaca.|Volcá los huevos batidos con queso y cociná tapado a fuego bajo 10 minutos.|Gratiná 2 minutos."],
["nicoise","B","Ensalada niçoise","Papa, chauchas, tomate, huevos duros, aceitunas. Él: atún. Ella: garbanzos y queso. Vinagreta de mostaza, limón y aceite.","Herví la papa y las chauchas.|Armá con tomate, huevo duro, aceitunas y la proteína de cada uno.|Aderezá con la vinagreta."],
["pizzeta","B","Pizzeta de masa casera","Masa de pan casero, salsa de tomate, muzzarella. Él: jamón. Ella: espinaca y huevo.","Estirá la masa en círculo y horneá 8 minutos a 230 °C.|Cubrí con salsa, muzzarella y los toppings.|Terminá 5 a 8 minutos."],
["sopaverd","B","Sopa de verduras","Cebolla, zanahoria, zapallo, papa, caldo. Él: fideos. Ella: 1 taza de garbanzos.","Salteá las verduras en cubos y cubrí con caldo.|Cociná 20 minutos; sumá fideos (él) o garbanzos (ella)."],
["hummus","B","Hummus casero (la yapa)","1½ tazas de garbanzos cocidos, 2 cdas de tahini, jugo de 1 limón, 1 ajo, sal, aceite de oliva o agua de cocción.","Procesá todo hasta que quede cremoso."]
];
function el(i){return document.getElementById(i)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function st(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var W=0,TODAY=(new Date().getDay()+6)%7,cur=TODAY;
function rec(id){return REC.filter(function(r){return r[0]===id})[0]}
function btns(ids){
  return '<div class="rb">'+ids.map(function(id){return '<button class="rbtn" data-rec="'+id+'">'+(ids.length>1?'Ver: '+esc(rec(id)[2].split(" (")[0]):'Ver receta')+'</button>'}).join("")+'</div>';
}
function pair(a,b,ids){
  return '<div class="split"><div class="him"><span class="who">Él</span>'+esc(a)+'</div><div class="her"><span class="who">Ella</span>'+esc(b)+'</div></div>'+btns(ids);
}
function renderWk(){
  el("wk").innerHTML=["Semana A","Semana B"].map(function(t,i){return '<button aria-pressed="'+(i===W)+'" data-w="'+i+'">'+t+'</button>'}).join("");
}
function renderDays(){
  el("days").innerHTML=DIAS.map(function(d,i){return '<button aria-pressed="'+(i===cur)+'" data-i="'+i+'">'+d.slice(0,3)+'<small>'+(i===TODAY?'hoy':'')+'</small></button>'}).join("");
}
function renderDay(){
  var m=MENU[W][cur],x=IDX[W],y=YAPA[W],h='<h2>'+DIAS[cur]+'</h2>'+
  '<div class="meal"><h3>Desayuno</h3><div class="shared">'+esc(DE[x.d[cur]])+'</div></div>'+
  '<div class="meal"><h3>Almuerzo</h3>'+pair(m[0],m[1],m[4])+'</div>'+
  '<div class="meal"><h3>Merienda</h3><div class="shared">'+esc(ME[x.m[cur]])+'</div>'+(x.m[cur]===2?btns(["budin"]):'')+'</div>'+
  '<div class="meal"><h3>Cena</h3>'+pair(m[2],m[3],m[5])+'</div>';
  if(cur>=5)h+='<div class="meal"><h3>La yapa del finde</h3><div class="shared">'+esc(y[0])+'</div>'+btns([y[1]])+'</div>';
  el("day").innerHTML=h;
}
function renderList(id,key,data,note){
  var s=st(key),h=note?'<p class="note">Tocá cada ítem para tacharlo mientras comprás. Cantidades aproximadas para 2 personas, 1 semana.</p>':'';
  data.forEach(function(sec,si){
    h+='<div class="sec"><h3>'+sec[0]+'</h3>'+sec[1].map(function(t,i){var k=si+"-"+i;return '<label class="it"><input type="checkbox" data-k="'+k+'"'+(s[k]?' checked':'')+'><span>'+esc(t)+'</span></label>'}).join("")+'</div>';
  });
  el(id).innerHTML=h+'<button class="reset" data-r="'+key+'">Destildar todo</button>';
}
function renderPrep(){
  var key="p"+W,s=st(key),h='<p class="note">Domingo, 2,5 a 3 horas, para la semana '+(W?'B':'A')+'.</p>';
  PREP[W].forEach(function(p,i){h+='<label class="it"><input type="checkbox" data-k="'+i+'"'+(s[i]?' checked':'')+'><span><b>'+p[0]+':</b> '+esc(p[1])+'</span></label>'});
  el("prep").innerHTML=h+'<p style="margin-top:14px"><button class="reset" data-r="'+key+'">Destildar todo</button></p>';
}
function renderRecetas(){
  var h='<p class="note">Tocá una receta para ver ingredientes y pasos. Porciones para 2 personas.</p>';
  [["A","Semana A"],["B","Semana B"]].forEach(function(g){
    h+='<div class="gh">'+g[1]+'</div>';
    REC.filter(function(r){return r[1]===g[0]}).forEach(function(r){
      h+='<details class="rc" id="r-'+r[0]+'"><summary>'+esc(r[2])+'</summary><p class="ing"><b>Ingredientes:</b> '+esc(r[3])+'</p><ol>'+r[4].split("|").map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ol></details>';
    });
  });
  el("recetas").innerHTML=h;
}
function renderAll(){renderWk();renderDay();renderList("compras","c"+W,COMPRAS[W],true);renderPrep()}
function showTab(t){
  document.querySelectorAll("nav.tabs button").forEach(function(x){x.setAttribute("aria-selected",x.dataset.t===t)});
  ["menu","compras","prep","recetas"].forEach(function(n){el(n).hidden=n!==t});
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.i!==undefined){cur=+b.dataset.i;renderDays();renderDay();return}
  if(b.dataset.w!==undefined){W=+b.dataset.w;renderAll();return}
  if(b.dataset.t){showTab(b.dataset.t);return}
  if(b.dataset.rec){showTab("recetas");var d=el("r-"+b.dataset.rec);if(d){d.open=true;d.scrollIntoView({block:"start"})}return}
  if(b.dataset.r){sv(b.dataset.r,{});if(b.dataset.r.charAt(0)==="p")renderPrep();else renderList("compras","c"+W,COMPRAS[W],true)}
});
document.addEventListener("change",function(e){
  var c=e.target;if(c.type!=="checkbox")return;
  var key=el("prep").contains(c)?"p"+W:"c"+W,s=st(key);s[c.dataset.k]=c.checked;sv(key,s);
});
renderDays();renderAll();renderRecetas();
</script>
</body>
</html>
